
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineFinder - Buscador de series</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="encabezado">
        <h1>🎬 CineFinder</h1>
        <p>Encuentra tus series favoritas</p>
    </header>

    <main class="contenedor">

        <section class="buscador">
            <h2>¿Qué serie quieres buscar?</h2>

            <div class="barra-busqueda">
                <input
                    type="text"
                    id="busqueda"
                    placeholder="Escribe el nombre de una serie..."
                >

                <button id="btnBuscar">Buscar</button>
            </div>
        </section>

        <section class="resultados">
            <h2>Resultados de búsqueda</h2>

            <div id="resultados" class="lista-resultados">
                <p>Escribe el nombre de una serie para comenzar.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Proyecto académico CineFinder</p>
        <p>Información proporcionada por
            <a href="https://www.tvmaze.com/" target="_blank">
                TVmaze
            </a>
        </p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
